# AI Craftsman Superpowers Configuration
# Generated by /craftsman:setup (situational init, project-level)
# Re-run /craftsman:setup to modify

version: "1.0"

strictness: "strict"
guided: false

packs:
  core: true
  python: true
  bash: true
  symfony: false
  react: false
  ai-ml: false

rules:
  git:
    conventional_commits: true
    no_ai_attribution: true

# Flat project layout (omp/, hermes/, hooks/, tests/), not Clean Architecture
# src/Domain-style: DDD layer-purity checks against ~/.claude/.craft-config.yml's
# global src/Domain/Application/Infrastructure/Presentation paths do not apply
# here and were the source of repeated false-positive layer-violation warnings
# during the local-telemetry branch's development. No paths mapping is set.
